# Duck's landing page: its own Cloudflare Pages project.
#
# The project kept its first name, tuck, when the app became Duck. Only the address
# changed: duck.hellodigitworks.com is attached to it, and the old tuck address redirects.
# Deploying from this folder:
#   npx wrangler pages deploy . --project-name tuck --branch main
#
# Attach an address to the project once, in the Cloudflare dashboard under
# Pages > tuck > Custom domains. Nothing here does that for you.

name = "tuck"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"

# Duck's numbers: update checks and daily download totals, read by /stats.
# scripts/make-stats-db.sh creates the database and writes its id here. Until then the
# placeholder only works for local testing, and the site counts nothing.
[[d1_databases]]
binding = "DB"
database_name = "duck-stats"
database_id = "1dceddf7-b721-4cd9-ae05-dd1ecc95eb65"
migrations_dir = "migrations"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Duck</title>
  <!-- The old address, from when the app was called Tuck, still points at this same
       page. Anyone arriving there is sent on to the new one. -->
  <script>
    if (location.hostname === 'tuck.hellodigitworks.com') {
      location.replace('https://duck.hellodigitworks.com' + location.pathname + location.search);
    }
  </script>
  <meta name="description" content="Duck hides the menu bar icons you are not using right now. One click and they are out of sight, one more and they are back. A small, free Mac app." />
  <link rel="canonical" href="https://duck.hellodigitworks.com/" />
  <meta name="theme-color" content="#F4EFE6" />
  <meta name="color-scheme" content="light" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Duck" />
  <meta property="og:title" content="Duck" />
  <meta property="og:description" content="Hides the menu bar icons you are not using right now. A small, free Mac app." />
  <meta property="og:url" content="https://duck.hellodigitworks.com/" />
  <meta property="og:image" content="https://duck.hellodigitworks.com/images/og.png?v=5" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Duck" />
  <meta name="twitter:description" content="Hides the menu bar icons you are not using right now. A small, free Mac app." />
  <meta name="twitter:image" content="https://duck.hellodigitworks.com/images/og.png?v=5" />

  <link rel="icon" href="images/favicon.svg?v=4" type="image/svg+xml" />
  <link rel="icon" href="images/favicon-32.png?v=3" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="site.webmanifest?v=3" />

  <link rel="preload" href="fonts/exposure-30.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/duck.css?v=4" />
</head>
<body>

  <!-- One screen. The headline, the menu bar playing what Duck does, the way in.
       Everything else is on GitHub. -->
  <main class="screen">
    <h1 class="reveal" style="--i:0">A quieter<br />menu bar.</h1>

    <!-- CSS only: the four dimmed icons on the left slide behind the mark and come
         back, the mark turns from an ✕ to a plus and back. The mark keeps its orange;
         everything else in the bar is faded so the eye lands on it. -->
    <div class="demo reveal" style="--i:1" aria-label="The icons to the left of Duck's mark slide away and come back">
      <div class="bar">
        <div class="bar-left" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <div class="bar-right">
          <div class="hides" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.5 12.8a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 11.5 3.5 3.5 0 0 0 7 18z"/></svg>
            <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20h4"/></svg>
            <svg viewBox="0 0 24 24"><path d="M14 3a8 8 0 1 0 7 11.5A7 7 0 0 1 14 3z"/></svg>
          </div>
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>
          </span>
          <div class="stays" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="16" height="9" rx="2"/><path d="M21 10.5v3"/><rect x="4.5" y="9.5" width="12" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          </div>
          <span class="clock" aria-hidden="true">Mon 10:24</span>
        </div>
      </div>
    </div>

    <!-- The way in: one link. Duck.dmg from the latest release, signed and notarised, so it
         opens with no warning: open it, drag Duck into Applications. -->
    <a class="button reveal" style="--i:2"
      href="https://github.com/hellodigitworks/Duck/releases/latest/download/Duck.dmg">Download for Mac</a>
    <p class="needs reveal" style="--i:3">macOS 13 or later, Apple silicon. Free.</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
